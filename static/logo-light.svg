<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- 浅色背景版：用于浅色 topbar -->
  <!-- 书本外框（蓝色 V 字） -->
  <path d="M32 6 L6 22 L32 38 L58 22 Z" fill="#3b82f6" stroke="#3b82f6" stroke-width="0.5" stroke-linejoin="round"/>
  <!-- 左侧书页 -->
  <path d="M6 22 L6 46 Q6 50 10 52 L32 60 L32 38 Z" fill="#94a3b8" opacity="0.9"/>
  <!-- 右侧书页 -->
  <path d="M58 22 L58 46 Q58 50 54 52 L32 60 L32 38 Z" fill="#cbd5e1" opacity="0.9"/>
  <!-- 左侧纹理 -->
  <path d="M12 28 Q18 32 14 38 Q20 40 18 46" stroke="#64748b" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- 右侧纹理 -->
  <path d="M52 28 Q46 32 50 38 Q44 40 46 46" stroke="#94a3b8" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- 连线 -->
  <g stroke="#3b82f6" stroke-width="0.8" opacity="0.6">
    <line x1="20" y1="14" x2="32" y2="10"/>
    <line x1="44" y1="14" x2="32" y2="10"/>
    <line x1="20" y1="14" x2="14" y2="20"/>
    <line x1="44" y1="14" x2="50" y2="20"/>
    <line x1="32" y1="10" x2="32" y2="16"/>
  </g>
  <!-- 节点 -->
  <circle cx="32" cy="10" r="2.5" fill="#3b82f6"/>
  <circle cx="20" cy="14" r="2" fill="#94a3b8"/>
  <circle cx="44" cy="14" r="2" fill="#94a3b8"/>
  <circle cx="14" cy="20" r="1.5" fill="#3b82f6"/>
  <circle cx="50" cy="20" r="1.5" fill="#94a3b8"/>
  <circle cx="32" cy="16" r="1.2" fill="#cbd5e1"/>
</svg>
