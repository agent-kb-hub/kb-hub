<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Book shape - left page -->
  <path d="M50 15 L15 35 L15 75 L50 85 Z" fill="url(#grad1)" opacity="0.9"/>
  <!-- Book shape - right page -->
  <path d="M50 15 L85 35 L85 75 L50 85 Z" fill="#3b82f6" opacity="0.7"/>
  <!-- Center line (spine) -->
  <line x1="50" y1="15" x2="50" y2="85" stroke="#1e3a8a" stroke-width="2"/>
  <!-- Network nodes -->
  <circle cx="30" cy="25" r="4" fill="#60a5fa"/>
  <circle cx="70" cy="25" r="4" fill="#60a5fa"/>
  <circle cx="50" cy="10" r="5" fill="#3b82f6"/>
  <circle cx="30" cy="50" r="3" fill="#93c5fd"/>
  <circle cx="70" cy="50" r="3" fill="#93c5fd"/>
  <circle cx="50" cy="60" r="3" fill="#93c5fd"/>
  <!-- Network connections -->
  <line x1="30" y1="25" x2="50" y2="10" stroke="#60a5fa" stroke-width="1.5" opacity="0.8"/>
  <line x1="70" y1="25" x2="50" y2="10" stroke="#60a5fa" stroke-width="1.5" opacity="0.8"/>
  <line x1="30" y1="25" x2="30" y2="50" stroke="#93c5fd" stroke-width="1" opacity="0.6"/>
  <line x1="70" y1="25" x2="70" y2="50" stroke="#93c5fd" stroke-width="1" opacity="0.6"/>
  <line x1="30" y1="50" x2="50" y2="60" stroke="#93c5fd" stroke-width="1" opacity="0.6"/>
  <line x1="70" y1="50" x2="50" y2="60" stroke="#93c5fd" stroke-width="1" opacity="0.6"/>
</svg>
